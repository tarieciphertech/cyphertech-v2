<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Cloud infrastructure console with server rack and deployment status">
  <defs>
    <radialGradient id="cloud-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#060b14"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#cloud-bg)" stroke="#1e293b" stroke-width="1"/>
  <path d="M40 56 H760" stroke="#1e293b" stroke-width="1" opacity="0.6"/>
  <!-- Window frame -->
  <rect x="80" y="80" width="640" height="340" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="80" y="80" width="640" height="34" fill="#1e293b"/>
  <circle cx="100" cy="97" r="4.5" fill="#f87171"/>
  <circle cx="120" cy="97" r="4.5" fill="#facc15"/>
  <circle cx="140" cy="97" r="4.5" fill="#4ade80"/>
  <text x="160" y="100" fill="#94a3b8" font-size="13" font-family="ui-monospace,monospace">Cloud Console — Cypher</text>
  <!-- Cloud graphic -->
  <g transform="translate(600,150)">
    <ellipse cx="0" cy="20" rx="54" ry="22" fill="#1e293b" opacity="0.8"/>
    <ellipse cx="-30" cy="26" rx="26" ry="12" fill="#22d3ee" opacity="0.35"/>
    <ellipse cx="30" cy="26" rx="26" ry="12" fill="#22d3ee" opacity="0.35"/>
    <circle cx="-50" cy="26" r="5" fill="#22d3ee"/>
    <circle cx="50" cy="26" r="5" fill="#22d3ee"/>
    <path d="M-26 20 L0 -8 L26 20" stroke="#22d3ee" stroke-width="2" fill="none"/>
  </g>
  <!-- Server rack (left) -->
  <g transform="translate(120,180)">
    <rect x="0" y="0" width="110" height="180" rx="8" fill="#1e293b" stroke="#334155"/>
    <rect x="4" y="6" width="102" height="46" rx="4" fill="#0f172a"/>
    <circle cx="14" cy="26" r="5" fill="#4ade80"/>
    <circle cx="28" cy="26" r="5" fill="#facc15"/>
    <circle cx="42" cy="26" r="5" fill="#f87171"/>
    <text x="70" y="30" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">web-01</text>
    <rect x="4" y="70" width="102" height="46" rx="4" fill="#0f172a"/>
    <circle cx="14" cy="90" r="5" fill="#4ade80"/>
    <text x="70" y="94" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">db-01</text>
    <rect x="4" y="134" width="102" height="46" rx="4" fill="#0f172a"/>
    <circle cx="14" cy="154" r="5" fill="#4ade80"/>
    <text x="70" y="158" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">cache-01</text>
  </g>
  <!-- Status cards -->
  <g>
    <rect x="260" y="126" width="150" height="68" rx="8" fill="#1e293b"/>
    <text x="272" y="150" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">Instances</text>
    <text x="272" y="176" fill="#22d3ee" font-size="22" font-weight="700">12</text>
    <rect x="420" y="126" width="150" height="68" rx="8" fill="#1e293b"/>
    <text x="432" y="150" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">Deployments</text>
    <text x="432" y="176" fill="#4ade80" font-size="22" font-weight="700">84</text>
    <rect x="580" y="126" width="150" height="68" rx="8" fill="#1e293b"/>
    <text x="592" y="150" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">Regions</text>
    <text x="592" y="176" fill="#a78bfa" font-size="22" font-weight="700">3</text>
  </g>
  <!-- Deployment log -->
  <g transform="translate(260,334)">
    <rect x="0" y="0" width="470" height="50" rx="8" fill="#1e293b"/>
    <text x="16" y="17" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">STATUS        SERVICE        REGION        TIME</text>
    <rect x="16" y="30" width="240" height="3" fill="#334155" rx="2"/>
    <rect x="270" y="30" width="100" height="3" fill="#334155" rx="2"/>
    <rect x="390" y="30" width="80" height="3" fill="#334155" rx="2"/>
  </g>
</svg>