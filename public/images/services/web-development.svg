<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Dark analytics dashboard with charts and data cards">
  <defs>
    <radialGradient id="dash-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#060b14"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#dash-bg)" stroke="#1e293b" stroke-width="1"/>
  <path d="M40 56 H760" stroke="#1e293b" stroke-width="1" opacity="0.6"/>
  <!-- Window frame -->
  <rect x="80" y="80" width="640" height="340" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="80" y="80" width="640" height="34" fill="#1e293b"/>
  <circle cx="100" cy="97" r="4.5" fill="#f87171"/>
  <circle cx="120" cy="97" r="4.5" fill="#facc15"/>
  <circle cx="140" cy="97" r="4.5" fill="#4ade80"/>
  <text x="160" y="100" fill="#94a3b8" font-size="13" font-family="ui-monospace,monospace">Dashboard — Cypher</text>
  <!-- Data cards (top) -->
  <g>
    <rect x="96" y="126" width="136" height="62" rx="8" fill="#1e293b"/>
    <text x="108" y="150" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">Active users</text>
    <text x="108" y="176" fill="#22d3ee" font-size="22" font-weight="700">2,841</text>
    <rect x="252" y="126" width="136" height="62" rx="8" fill="#1e293b"/>
    <text x="264" y="150" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">Revenue</text>
    <text x="264" y="176" fill="#4ade80" font-size="22" font-weight="700">$42.3k</text>
    <rect x="408" y="126" width="136" height="62" rx="8" fill="#1e293b"/>
    <text x="420" y="150" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">Open tickets</text>
    <text x="420" y="176" fill="#facc15" font-size="22" font-weight="700">24</text>
    <rect x="564" y="126" width="136" height="62" rx="8" fill="#1e293b"/>
    <text x="576" y="150" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">Uptime</text>
    <text x="576" y="176" fill="#a78bfa" font-size="22" font-weight="700">99.9%</text>
  </g>
  <!-- Line chart -->
  <g transform="translate(96,202)">
    <rect x="0" y="0" width="290" height="120" rx="8" fill="#1e293b"/>
    <path d="M0 90 L58 70 L116 62 L174 40 L232 50 L290 30" stroke="#22d3ee" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="12" y="112" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">Sessions (k)</text>
  </g>
  <!-- Bar chart -->
  <g transform="translate(418,202)">
    <rect x="0" y="0" width="290" height="120" rx="8" fill="#1e293b"/>
    <rect x="50" y="70" width="30" height="50" fill="#a78bfa" rx="3"/>
    <rect x="110" y="40" width="30" height="80" fill="#a78bfa" rx="3"/>
    <rect x="170" y="60" width="30" height="60" fill="#a78bfa" rx="3"/>
    <rect x="230" y="30" width="30" height="90" fill="#a78bfa" rx="3"/>
    <text x="12" y="112" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">Requests</text>
  </g>
  <!-- Data table (bottom) -->
  <g transform="translate(96,334)">
    <rect x="0" y="0" width="608" height="50" rx="8" fill="#1e293b"/>
    <text x="16" y="17" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">ORDER      STATUS      AMOUNT      DATE</text>
    <rect x="16" y="30" width="420" height="3" fill="#334155" rx="2"/>
    <rect x="440" y="30" width="90" height="3" fill="#334155" rx="2"/>
    <rect x="546" y="30" width="60" height="3" fill="#334155" rx="2"/>
  </g>
</svg>