<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Cybersecurity dashboard with shield, status indicators and event log">
  <defs>
    <radialGradient id="sec-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#060b14"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#sec-bg)" stroke="#1e293b" stroke-width="1"/>
  <path d="M40 56 H760" stroke="#1e293b" stroke-width="1" opacity="0.6"/>
  <!-- Window frame -->
  <rect x="80" y="80" width="640" height="340" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="80" y="80" width="640" height="34" fill="#1e293b"/>
  <circle cx="100" cy="97" r="4.5" fill="#f87171"/>
  <circle cx="120" cy="97" r="4.5" fill="#facc15"/>
  <circle cx="140" cy="97" r="4.5" fill="#4ade80"/>
  <text x="160" y="100" fill="#94a3b8" font-size="13" font-family="ui-monospace,monospace">Security Center — Cypher</text>
  <!-- Shield -->
  <g transform="translate(400,270)">
    <path d="M0-70 L-70-44 V20 C0 40 70 40 70 40 C70 40 140 20 140-34 L140-70 C70-100 0-100 0-70 Z" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    <path d="M-26-22 L-6 4 L26-22 L6-38 Z" fill="#22d3ee" stroke="#22d3ee" stroke-width="2"/>
  </g>
  <!-- Status cards -->
  <g>
    <rect x="96" y="126" width="166" height="68" rx="8" fill="#1e293b"/>
    <text x="108" y="152" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">Threats blocked</text>
    <text x="108" y="178" fill="#4ade80" font-size="22" font-weight="700">1,243</text>
    <circle cx="240" cy="180" r="7" fill="#4ade80"/>
    <rect x="280" y="126" width="166" height="68" rx="8" fill="#1e293b"/>
    <text x="292" y="152" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">Vulnerabilities</text>
    <text x="292" y="178" fill="#facc15" font-size="22" font-weight="700">7</text>
    <rect x="476" y="126" width="166" height="68" rx="8" fill="#1e293b"/>
    <text x="488" y="152" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">Compliance</text>
    <text x="488" y="178" fill="#a78bfa" font-size="22" font-weight="700">98%</text>
  </g>
  <!-- Event log -->
  <g transform="translate(96,334)">
    <rect x="0" y="0" width="608" height="50" rx="8" fill="#1e293b"/>
    <text x="16" y="17" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">TIME     EVENT                          SOURCE</text>
    <rect x="16" y="30" width="300" height="3" fill="#334155" rx="2"/>
    <rect x="330" y="30" width="180" height="3" fill="#334155" rx="2"/>
    <rect x="528" y="30" width="80" height="3" fill="#334155" rx="2"/>
  </g>
  <!-- Blinking secure LED -->
  <circle cx="620" cy="378" r="6" fill="#4ade80" opacity="0.4"/>
</svg>