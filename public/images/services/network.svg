<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Network topology map with nodes and data flow connections">
  <defs>
    <radialGradient id="net-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0a111e"/>
      <stop offset="100%" stop-color="#060b14"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#net-bg)" stroke="#1e293b" stroke-width="1"/>
  <path d="M40 56 H760" stroke="#1e293b" stroke-width="1" opacity="0.6"/>
  <!-- Window frame -->
  <rect x="80" y="80" width="640" height="340" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="80" y="80" width="640" height="34" fill="#1e293b"/>
  <circle cx="100" cy="97" r="4.5" fill="#f87171"/>
  <circle cx="120" cy="97" r="4.5" fill="#facc15"/>
  <circle cx="140" cy="97" r="4.5" fill="#4ade80"/>
  <text x="160" y="100" fill="#94a3b8" font-size="13" font-family="ui-monospace,monospace">Network Monitor — Cypher</text>
  <!-- Topology: central hub + surrounding nodes -->
  <g transform="translate(400,270)">
    <!-- links -->
    <line x1="0" y1="0" x2="-120" y2="-70" stroke="#22d3ee" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="0" x2="120" y2="-70" stroke="#22d3ee" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="0" x2="-130" y2="70" stroke="#a78bfa" stroke-width="1.5" opacity="0.35"/>
    <line x1="0" y1="0" x2="130" y2="70" stroke="#a78bfa" stroke-width="1.5" opacity="0.35"/>
    <!-- central hub -->
    <circle cx="0" cy="0" r="18" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
    <!-- surrounding nodes -->
    <g fill="#0f172a" stroke="#a78bfa" stroke-width="2">
      <circle cx="-120" cy="-70" r="12"/>
      <circle cx="120" cy="-70" r="12"/>
      <circle cx="-130" cy="70" r="12"/>
      <circle cx="130" cy="70" r="12"/>
    </g>
    <!-- node labels -->
    <text x="-128" y="-58" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">office-gw</text>
    <text x="124" y="-58" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">vpn</text>
    <text x="-138" y="86" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">dc-01</text>
    <text x="134" y="86" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">proxy</text>
    <!-- data flow arcs -->
    <path d="M-120-70 A18 18 0 0 1 -102-52" stroke="#22d3ee" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M120-70 A18 18 0 0 0 102-52" stroke="#a78bfa" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>
  <!-- Ping status rows -->
  <g transform="translate(96,334)">
    <rect x="0" y="0" width="608" height="50" rx="8" fill="#1e293b"/>
    <text x="16" y="17" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">HOST              LATENCY   STATUS   LAST UP</text>
    <rect x="16" y="30" width="300" height="3" fill="#334155" rx="2"/>
    <rect x="330" y="30" width="60" height="3" fill="#334155" rx="2"/>
    <rect x="410" y="30" width="60" height="3" fill="#334155" rx="2"/>
    <rect x="490" y="30" width="118" height="3" fill="#334155" rx="2"/>
  </g>
</svg>