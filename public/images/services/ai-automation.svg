<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="AI automation workflow with connected intelligence nodes and data flow">
  <defs>
    <radialGradient id="ai-bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#060b14"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#ai-bg)" stroke="#1e293b" stroke-width="1"/>
  <path d="M40 56 H760" stroke="#1e293b" stroke-width="1" opacity="0.6"/>
  <!-- Window frame -->
  <rect x="80" y="80" width="640" height="340" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="80" y="80" width="640" height="34" fill="#1e293b"/>
  <circle cx="100" cy="97" r="4.5" fill="#f87171"/>
  <circle cx="120" cy="97" r="4.5" fill="#facc15"/>
  <circle cx="140" cy="97" r="4.5" fill="#4ade80"/>
  <text x="160" y="100" fill="#94a3b8" font-size="13" font-family="ui-monospace,monospace">AI Workflow — Cypher</text>
  <!-- Central brain node -->
  <g transform="translate(400,260)">
    <ellipse cx="0" cy="0" rx="44" ry="30" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <path d="M-18-8 C-6-18 6-18 18-8 M-18 8 C-6 18 6 18 18 8" stroke="#a78bfa" stroke-width="2" fill="none"/>
    <circle cx="0" cy="0" r="5" fill="#22d3ee"/>
  </g>
  <!-- Connected workflow nodes -->
  <g fill="#0f172a" stroke="#22d3ee" stroke-width="2">
    <rect x="-180" y="-40" width="90" height="56" rx="8"/>
    <rect x="180" y="-40" width="90" height="56" rx="8"/>
    <rect x="-90" y="90" width="90" height="56" rx="8"/>
    <rect x="0" y="90" width="90" height="56" rx="8"/>
    <rect x="90" y="90" width="90" height="56" rx="8"/>
  </g>
  <text x="224" y="-18" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">Trigger</text>
  <text x="224" y="124" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">Data extract</text>
  <text x="58" y="124" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">Predict</text>
  <text x="-38" y="124" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">Classify</text>
  <text x="-138" y="124" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">Enrich</text>
  <!-- Flow lines -->
  <path d="M-135-12 L-12 -8" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <path d="M12 -8 L135-12" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <path d="M0 30 L0 64" stroke="#a78bfa" stroke-width="1.5" opacity="0.5"/>
  <path d="M-45 64 L-45 90" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <path d="M0 64 L0 90" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <path d="M45 64 L45 90" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <!-- Status -->
  <g transform="translate(96,334)">
    <rect x="0" y="0" width="608" height="50" rx="8" fill="#1e293b"/>
    <text x="16" y="17" fill="#94a3b8" font-size="11" font-family="ui-monospace,monospace">JOB        MODEL        STATUS        LATENCY</text>
    <rect x="16" y="30" width="300" height="3" fill="#334155" rx="2"/>
    <rect x="330" y="30" width="80" height="3" fill="#334155" rx="2"/>
    <rect x="420" y="30" width="80" height="3" fill="#334155" rx="2"/>
    <rect x="510" y="30" width="88" height="3" fill="#334155" rx="2"/>
  </g>
</svg>