  <text x="540" y="100" fill="#94a3b8" font-size="12" font-family="ui-monospace,monospace">build — zsh</text>
  <g font-family="ui-monospace,monospace" font-size="12">
    <text x="540" y="140" fill="#4ade80">$ npm run build</text>
