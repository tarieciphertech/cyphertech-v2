    <text x="240" y="148" fill="#a78bfa">from</text>
    <text x="292" y="148" fill="#4ade80">'./core'</text>
    <text x="84" y="180" fill="#22d3ee">router</text>
    <text x="136" y="180" fill="#94a3b8">.</text>
    <text x="144" y="180" fill="#a78bfa">get</text>
    <text x="176" y="180" fill="#94a3b8">(</text>
    <text x="184" y="180" fill="#4ade80">'/jobs'</text>
    <text x="248" y="180" fill="#94a3b8">, handler)</text>
    <rect x="84" y="200" width="330" height="18" rx="4" fill="#1e293b" opacity="0.5"/>
    <text x="84" y="236" fill="#a78bfa">export async function</text>
    <text x="288" y="236" fill="#22d3ee">handler</text>
    <text x="360" y="236" fill="#94a3b8">(req) {</text>
    <text x="104" y="268" fill="#a78bfa">const</text>
    <text x="152" y="268" fill="#94a3b8">list = </text>
    <text x="216" y="268" fill="#a78bfa">await</text>
    <text x="272" y="268" fill="#22d3ee">db.jobs</text>
    <text x="344" y="268" fill="#94a3b8">.find()</text>
    <text x="104" y="300" fill="#a78bfa">return</text>
    <text x="160" y="300" fill="#22d3ee">json</text>
    <text x="196" y="300" fill="#94a3b8">(list, </text>
    <text x="252" y="300" fill="#facc15">200</text>
    <text x="280" y="300" fill="#94a3b8">)</text>
    <text x="84" y="332" fill="#94a3b8">}</text>
    <rect x="84" y="352" width="150" height="18" rx="4" fill="#1e293b" opacity="0.5"/>
    <rect x="84" y="382" width="240" height="18" rx="4" fill="#1e293b" opacity="0.5"/>
  </g>
  <!-- Terminal / build panel -->
  <rect x="524" y="80" width="216" height="340" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
