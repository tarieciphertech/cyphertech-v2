<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Dark code editor with syntax-highlighted code and a build terminal">
  <defs>
    <radialGradient id="code-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#060b14"/>
