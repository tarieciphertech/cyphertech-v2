<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="IT service center with laptop, phone and repair tools">
  <defs>
    <radialGradient id="dev-bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#060b14"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#dev-bg)" stroke="#1e293b" stroke-width="1"/>
  <path d="M40 56 H760" stroke="#1e293b" stroke-width="1" opacity="0.6"/>
  <!-- Window frame -->
  <rect x="80" y="80" width="640" height="340" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="80" y="80" width="640" height="34" fill="#1e293b"/>
  <circle cx="100" cy="97" r="4.5" fill="#f87171"/>
  <circle cx="120" cy="97" r="4.5" fill="#facc15"/>
  <circle cx="140" cy="97" r="4.5" fill="#4ade80"/>
  <text x="160" y="100" fill="#94a3b8" font-size="13" font-family="ui-monospace,monospace">Service Center — Cypher</text>
  <!-- Laptop (closed) -->
  <g transform="translate(220,180)">
    <rect x="0" y="0" width="220" height="140" rx="10" fill="#1e293b" stroke="#33415b"/>
    <rect x="10" y="10" width="200" height="4" fill="#060b14" rx="2"/>
    <rect x="20" y="22" width="180" height="100" rx="6" fill="#060b14"/>
    <circle cx="110" cy="90" r="16" fill="#94a3b8"/>
    <rect x="70" y="118" width="180" height="12" rx="2" fill="#94a3b8"/>
  </g>
  <!-- Phone -->
  <g transform="translate(480,180)">
    <rect x="0" y="0" width="90" height="140" rx="14" fill="#1e293b" stroke="#33415b"/>
    <rect x="14" y="12" width="62" height="100" rx="8" fill="#060b14"/>
    <rect x="38" y="20" width="8" height="8" rx="4" fill="#22d3ee"/>
    <circle cx="45" cy="52" r="14" fill="#94a3b8"/>
    <rect x="18" y="120" width="54" height="8" rx="4" fill="#94a3b8"/>
  </g>
  <!-- Tools -->
  <g transform="translate(420,340)" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round">
    <line x1="-40" y1="20" x2="0" y2="0"/>
    <line x1="0" y1="0" x2="40" y2="20"/>
    <circle cx="0" cy="0" r="8" fill="none"/>
    <rect x="-12" y="0" width="24" height="48" rx="4" fill="none"/>
  </g>
  <!-- Status LEDs -->
  <circle cx="300" cy="420" r="7" fill="#4ade80"/>
  <text x="312" y="425" fill="#94a3b8" font-size="12" font-family="ui-monospace,monospace">online</text>
  <circle cx="360" cy="420" r="7" fill="#facc15"/>
  <text x="372" y="425" fill="#94a3b8" font-size="12" font-family="ui-monospace,monospace">pending</text>
  <!-- Parts list -->
  <g fill="#94a3b8" font-size="12" font-family="ui-monospace,monospace">
    <text x="96" y="425">Screen | Battery | SSD | RAM | Board</text>
  </g>
</svg>