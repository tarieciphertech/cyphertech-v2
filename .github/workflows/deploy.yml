name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure optional Google Tag Manager for standalone repair pages
        shell: bash
        env:
          VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${VITE_GTM_ID}" ]]; then
            if [[ ! "${VITE_GTM_ID}" =~ ^GTM-[A-Z0-9]+$ ]]; then
              echo "ERROR: VITE_GTM_ID must look like GTM-XXXXXXX."
              exit 1
            fi
            sed -i "s/__VITE_GTM_ID__/${VITE_GTM_ID}/g" public/repair-funnel.js
            echo "Google Tag Manager configured for standalone repair pages."
          else
            echo "VITE_GTM_ID is not configured yet; tracking events will queue but won't be sent to Google."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: true
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}

      - name: Verify public bundle contains no admin application references
        shell: bash
        run: |
          set -euo pipefail

          # These patterns identify the CypherTech admin application itself.
          # Do not scan for a generic /admin path: Supabase Auth legitimately
          # contains /admin API endpoints inside its client library.
          patterns='admin\.cyphertech\.co\.zw|cyphertech-admin|AdminDashboard|AdminLayout|AdminTickets|AdminTicketDetail|AdminRoute'

          echo "Scanning public source files..."
          if grep -RniE "$patterns" src public index.html package.json README.md 2>/dev/null; then
            echo "ERROR: Public source contains an admin application reference."
            exit 1
          fi

          echo "Scanning production dist/ bundle..."
          if grep -RniE "$patterns" dist 2>/dev/null; then
            echo "ERROR: Production bundle contains an admin application reference."
            exit 1
          fi

          echo "PASS: No CypherTech admin application references found in public source or production bundle."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
