name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          # Optional: add these as repository secrets so the contact form uses
          # EmailJS in CI builds. Without them the form falls back to mailto.
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify public bundle contains no admin application references
        shell: bash
        run: |
          set -euo pipefail
          patterns='admin\.cyphertech\.co\.zw|cyphertech-admin|AdminDashboard|AdminLayout|AdminTickets|AdminTicketDetail|AdminRoute|/admin([/?"'"'"'`]|$)'

          echo "Scanning source and public files..."
          if grep -RniE "$patterns" src public scripts index.html package.json README.md .github 2>/dev/null; then
            echo "ERROR: Public repository contains an admin application reference."
            exit 1
          fi

          echo "Scanning production dist/ bundle..."
          if grep -RniE "$patterns" dist 2>/dev/null; then
            echo "ERROR: Production bundle contains an admin application reference."
            exit 1
          fi

          echo "PASS: No admin application references found in source or production bundle."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
